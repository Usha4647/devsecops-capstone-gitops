# Argo CD-managed demo environment on KIND (full platform installed).
# CI rewrites image.repository and image.tag in THIS file after a green pipeline.
image:
  repository: ravinadh/student-task-manager
  tag: "4942f6a"
service:
  type: NodePort
  nodePort: 30080 # mapped to EC2 host port 8080 by infra/kind/kind-config.yaml
keda:
  enabled: true
metrics:
  serviceMonitor:
    enabled: true
  grafanaDashboard:
    enabled: true
postgres:
  enabled: true
