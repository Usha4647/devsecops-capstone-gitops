apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: student-task-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the App removes its resources
spec:
  project: capstone
  source:
    repoURL: https://github.com/ravinadh777/devsecops-capstone-gitops.git
    targetRevision: main
    path: charts/student-task-manager
    helm:
      releaseName: student-task-manager
      valueFiles:
        - values.yaml
        - values-demo.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: capstone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true      # manual kubectl edits are reverted: Git is the source of truth
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
  revisionHistoryLimit: 10
