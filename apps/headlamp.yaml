# Argo CD Application for Headlamp (Kubernetes web UI).
# Source 1: the official Helm chart, pinned. Source 2: our values file.
# Source 3: login identities (platform/headlamp/access).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default          # platform app: needs cluster-scoped RBAC objects
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.46.0
      helm:
        releaseName: headlamp
        valueFiles:
          - $values/platform/headlamp/values.yaml
    - repoURL: https://github.com/ravinadh777/devsecops-capstone-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ravinadh777/devsecops-capstone-gitops.git
      targetRevision: main
      path: platform/headlamp/access
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
